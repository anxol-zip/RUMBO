[project]
name = "rumbo-backend"
version = "0.1.0"
description = "Backend de RUMBO: turismo_core, FastAPI y servidor MCP"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.143.2",
    "mcp>=1.20,<2",
    "psycopg[binary,pool]>=3.3.8",
    "pypdf>=6.20.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`", "ignore::DeprecationWarning:chromadb.*"]
